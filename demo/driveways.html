<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stonebeck Driveways · Demo website</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #23272E; color: #F3F1EC; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
  a { color: #E8C547; }
  button { background: #E8C547; color: #23272E; border: 0; padding: 14px 22px; font-weight: 700; text-transform: uppercase; font-size: 15px; cursor: pointer; }
  .note { background: #F2651C; color: #fff; font-size: 14px; padding: 10px 16px; text-align: center; }
  .note a { color: #fff; font-weight: 700; }
  header { max-width: 1000px; margin: 0 auto; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 20px; text-transform: uppercase; }
  main { max-width: 1000px; margin: 0 auto; padding: 50px 24px 100px; }
  h1 { font-size: clamp(34px, 6vw, 60px); text-transform: uppercase; line-height: 1.05; margin: 0 0 16px; }
  p { font-size: 18px; max-width: 34em; opacity: .85; }
</style>
</head>
<body>
<div class="note">Pretend business website for testing a "site visit" quote form. <a href="/demo/">Back to the cleaning demo</a></div>
<header><div class="logo">Stonebeck Driveways</div><a href="#" data-jobaro-open>Book a free survey</a></header>
<main>
  <h1>Driveways that last.</h1>
  <p>Block paving, resin bound and tarmac driveways across Cambridgeshire. Tell us about your project and we'll come and measure up.</p>
  <p><button type="button" data-jobaro-open>Request a visit</button> <button type="button" data-jobaro-open="patio">Patio enquiry</button></p>
</main>
<script src="/widget.js" data-business="demo-driveways" data-label="Request a visit"></script>
</body>
</html>
